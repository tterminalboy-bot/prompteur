<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e13">
  <title>Prompteur</title>
  <style>
    :root{--bg:#090c11;--panel:#11161e;--line:#29313d;--text:#f3f5f7;--muted:#929baa;--accent:#f2ad42}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}body{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}main{width:min(700px,100%);padding:32px;border:1px solid var(--line);border-radius:20px;background:var(--panel)}h1{margin:0 0 10px;font-size:42px}h1 span{color:var(--accent)}p{color:var(--muted);line-height:1.6}a{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:12px;background:#151b23;color:var(--text);text-decoration:none}a:hover{border-color:var(--accent)}a small{display:block;margin-top:5px;color:var(--muted)}@media(max-width:600px){main{padding:22px}h1{font-size:34px}}
  </style>
</head>
<body>
  <main>
    <h1>Mon <span>prompteur</span></h1>
    <p id="message">Préparation de l’écran…</p>
    <a id="screenLink" href="prompter.html?v=20260912"><span><strong>Écran prompteur</strong><small>Écrire et lancer votre script sur cet appareil</small></span><b>→</b></a>
  </main>
  <script>
    (()=>{
      const ua=navigator.userAgent.toLowerCase();
      const mobile=/android|iphone|ipad|ipod|windows phone|mobile/.test(ua);
      const desktopOverride=new URLSearchParams(location.search).has('desktop');
      if(mobile&&!desktopOverride){location.replace('remote.html?v=20260912');return;}
      document.getElementById('message').textContent='Vous êtes sur l’écran ordinateur/tablette. Cliquez ci-dessous pour écrire votre script.';
    })();
  </script>
</body>
</html>
