<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Prompteur — télécommande</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="glass-sheen"></div>

<div class="remote">
  <div class="remote-header">
    <span class="brand">Télécommande</span>
    <div class="status-pill" id="status-pill"><span class="status-dot"></span><span id="status-text">Non connecté</span></div>
  </div>

  <!-- ======== ÉCRAN DE CONNEXION ======== -->
  <div class="join-screen" id="join-screen">
    <h2>Rejoindre un prompteur</h2>
    <p>Entre le code à 4 chiffres affiché sur l'écran du prompteur.</p>
    <div class="code-input" id="code-input">
      <input inputmode="numeric" maxlength="1" pattern="[0-9]*">
      <input inputmode="numeric" maxlength="1" pattern="[0-9]*">
      <input inputmode="numeric" maxlength="1" pattern="[0-9]*">
      <input inputmode="numeric" maxlength="1" pattern="[0-9]*">
    </div>
    <button class="btn btn-primary" id="join-btn" disabled>Se connecter</button>
  </div>

  <!-- ======== ÉCRAN DE CONTRÔLE ======== -->
  <div class="remote-control" id="control-screen">
    <div class="control-row">
      <div class="label">Défilement<span class="value" id="speed-value">1.0×</span></div>
      <div class="stepper">
        <button class="step-btn" id="speed-down" aria-label="Ralentir">−</button>
        <button class="step-btn" id="speed-up" aria-label="Accélérer">+</button>
      </div>
    </div>

    <div class="remote-play-wrap">
      <button class="play-btn" id="play-btn" aria-label="Lecture / Pause">
        <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
    </div>

    <div class="control-row">
      <div class="label">Taille du texte<span class="value" id="fontsize-value">48px</span></div>
      <div class="stepper">
        <button class="step-btn" id="font-down" aria-label="Réduire">−</button>
        <button class="step-btn" id="font-up" aria-label="Agrandir">+</button>
      </div>
    </div>

    <div class="icon-btn-row">
      <button class="icon-btn" id="nudge-up">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        Reculer
      </button>
      <button class="icon-btn" id="nudge-down">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
        Avancer
      </button>
      <button class="icon-btn" id="mirror-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M7 8l-4 4 4 4M17 8l4 4-4 4"/></svg>
        Miroir
      </button>
      <button class="icon-btn" id="restart-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg>
        Revenir au début
      </button>
    </div>

    <button class="btn btn-ghost" id="fullscreen-btn">Plein écran télécommande</button>
  </div>

  <div class="remote-footer">
    <span class="footnote" id="footer-text">Connexion pair-à-pair directe avec l'écran.</span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="js/common.js"></script>
<script src="js/remote.js"></script>
</body>
</html>
