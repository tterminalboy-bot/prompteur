<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#090c11"><title>Télécommande — Prompteur</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><main class="remote-shell"><section class="remote-card"><button class="ghost" id="backHome" style="margin-bottom:18px;font-size:18px">← Retour</button><div class="brand"><span class="brand-light"></span>PROMPTEUR <small>TÉLÉCOMMANDE</small></div><div id="connectView"><h2>Connexion</h2><p class="muted">Le téléphone est prêt. Entrez les <strong>4 chiffres affichés sur l'écran du prompteur</strong>.</p><div class="remote-code"><input id="codeInput" inputmode="numeric" autocomplete="one-time-code" maxlength="4" placeholder="1234"><button class="connect-btn" id="connectBtn">OK</button></div><p class="remote-help">Le code est créé automatiquement par l'écran. Vous pouvez aussi utiliser le QR code affiché sur l'écran.</p></div><div id="controlView" hidden><div class="status"><i id="dot" class="dot ok"></i><span id="connectionText">Connecté</span></div><div class="remote-controls"><button class="big" id="play">▶<span>Lecture / pause</span></button><button id="back">↶<span>Reculer</span></button><button id="forward">↷<span>Avancer</span></button><button id="slower">−<span>Plus lent</span></button><button id="faster">+<span>Plus rapide</span></button><button id="smaller">A−<span>Texte −</span></button><button id="larger">A+<span>Texte +</span></button><button id="restart">↺<span>Recommencer</span></button><button id="mirror">🪞<span>Miroir</span></button><button id="invert">↕<span>Inversé</span></button><button id="fullscreen">⛶<span>Plein écran</span></button></div><p class="remote-help">Les commandes sont envoyées à l'écran en direct.</p><button class="ghost" id="disconnect" style="width:100%;margin-top:12px">Déconnecter</button></div></section></main><div id="toast" class="toast"></div><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script src="js/common.js"></script><script src="js/remote.js"></script></body></html>
