<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prompteur — écran</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="glass-sheen"></div>

<!-- ======== ÉCRAN DE CONFIGURATION ======== -->
<main class="setup" id="setup-screen">
  <div class="setup-panel">
    <div class="setup-col">
      <h2>Ton texte</h2>
      <p class="hint">Colle ou écris le texte à faire défiler. Tu pourras ajuster la vitesse et la taille depuis la télécommande une fois connecté.</p>
      <textarea id="script-input" placeholder="Colle ton texte ici…">Bienvenue sur votre prompteur.

Collez votre texte ici, connectez votre téléphone comme télécommande, et lancez le défilement quand vous êtes prêt.</textarea>
      <div class="setup-actions">
        <button class="btn btn-primary" id="start-btn">Lancer le prompteur</button>
        <button class="btn btn-ghost" id="mirror-toggle-setup" type="button">Miroir : désactivé</button>
      </div>
    </div>

    <div class="setup-col">
      <h2>Connecter la télécommande</h2>
      <p class="hint">Scanne ce QR code avec ton téléphone, ou entre le code sur <strong>remote.html</strong>.</p>
      <div class="connect-box">
        <div class="status-pill" id="status-pill"><span class="status-dot"></span><span id="status-text">En attente…</span></div>
        <div class="code-display" id="code-display">····</div>
        <div id="qr-code"></div>
      </div>
    </div>
  </div>
</main>

<!-- ======== SCÈNE DE LECTURE (plein écran) ======== -->
<div class="prompter-stage" id="stage">
  <div class="prompter-hud" id="hud">
    <div class="hud-chip">
      <span id="hud-speed">1.0×</span>
      <span id="hud-state">Pause</span>
    </div>
    <button class="hud-exit" id="exit-btn">Quitter le plein écran</button>
  </div>
  <div class="prompter-centerline"></div>
  <div class="prompter-viewport">
    <div class="prompter-track" id="track">
      <div class="prompter-text" id="prompter-text"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="js/common.js"></script>
<script src="js/prompter.js"></script>
</body>
</html>
